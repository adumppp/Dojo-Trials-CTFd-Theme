{% extends "base.html" %}

{% block content %}
<div class="container">
  <section class="text-center" style="padding:80px 0">
    <div class="eyebrow" style="justify-content:center">SLOW DOWN</div>
    <div style="color:#ff4655;font-family:Consolas,monospace;font-size:96px;font-weight:700;letter-spacing:-.05em;margin-top:24px;line-height:1">429</div>
    <h1 style="font-size:30px;font-weight:750;letter-spacing:-.03em;margin-top:20px">Too many requests.</h1>
    <p class="text-muted" style="font-size:14px;margin-top:16px">Please slow down and try again in a moment.</p>
    <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:32px">
      <a href="{{ url_for('views.static_html', route='/') }}" class="btn btn-primary">Back to home</a>
      <a href="{{ url_for('challenges.listing') }}" class="btn">Explore challenges</a>
    </div>
  </section>
</div>
{% endblock %}
