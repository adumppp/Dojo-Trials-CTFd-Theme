{% extends "base.html" %}

{% block content %}
  <div class="container">
    <div class="page-head" style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px">
      <div>
        <div class="eyebrow"><span style="width:6px;height:6px;background:#ff4655;display:inline-block"></span>THE ARENA</div>
        <h1 style="letter-spacing:-.035em;margin:10px 0;font-size:38px;font-weight:750;line-height:1.15">{% trans %}Challenges{% endtrans %}</h1>
        <p class="text-muted" style="font-size:14px">Every flag is a lesson. Choose your next one.</p>
      </div>
    </div>

    {% include "components/errors.html" %}

    <div
      x-data="ChallengeBoard"
      @load-challenges.window="loadChallenges()"
      @load-challenge.window="loadChallenge($event.detail)"
    >
      <div
          x-ref="challengeWindow" id="challenge-window" class="modal fade" tabindex="-1" role="dialog" x-data=""
          x-html="$store.challenge.data.view"
      ></div>

      <div x-show="!loaded">
        <div class="min-vh-50 d-flex align-items-center">
          <div class="text-center w-100">
            <i class="fas fa-circle-notch fa-spin fa-3x fa-fw spinner"></i>
          </div>
        </div>
      </div>

      <div x-show="loaded" x-cloak>
        <template x-for="(category, idx) in getCategories()" :key="idx">
          <div class="pt-4">
            <div class="category-header mb-3" style="display:flex;align-items:center;gap:14px">
              <span style="width:22px;height:1px;background:#ff4655;display:inline-block"></span>
              <h3 x-text="category"></h3>
            </div>

            <div class="challenges-row row">
              <template x-for="(c, idx) in getChallenges(category)" :key="c.id">
                <div class="col-sm-6 col-md-4 col-lg-3 mb-3">
                  <button
                      class="btn surface challenge challenge-button w-100 h-100"
                      :class="[
                        c.solved_by_me ? 'challenge-solved solved' : '',
                        ...c.tags.map((tag) => `tag-${tag.value.replace(/ /g, '-')}`),
                      ]"
                      :value="c.id" @click="loadChallenge(c.id)"
                  >
                    <div class="challenge-inner" style="width:100%">
                      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
                        <span class="text-muted" style="font-size:11px" x-text="c.category"></span>
                        <span x-show="c.solved_by_me" class="pill pill-green">✓ SOLVED</span>
                      </div>
                      <p x-text="c.name" style="text-align:left"></p>
                      <div style="display:flex;justify-content:space-between;align-items:center;border-top:1px solid #272c35;padding-top:12px;margin-top:12px">
                        <span><span x-text="c.value"></span> <small class="text-muted" style="font-size:10px">PTS</small></span>
                        <span class="text-muted" style="font:10px Consolas,monospace" x-text="(c.solves ?? 0) + ' SOLVES'"></span>
                      </div>
                    </div>
                  </button>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>
    </div>
  </div>
{% endblock %}

{% block scripts %}
  {{ Assets.js("assets/js/challenges.js") }}
{% endblock %}
